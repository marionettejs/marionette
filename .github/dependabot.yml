version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      typescript-eslint:
        patterns: ['@typescript-eslint/*']
      vitest:
        patterns: ['vitest', '@vitest/*']
      mutation:
        patterns: ['@stryker-mutator/*']
      tooling-updates:
        dependency-type: development
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: marionette
      - dependency-name: '@mnjs/*'
      # Remove when @rollup/plugin-babel supports Babel 8 and the build is validated.
      - dependency-name: '@babel/*'
        update-types: [version-update:semver-major]
      # Remove after typescript-eslint and compiler-API tooling support TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    # Keep this inventory synchronized with config/release-validation.json.
    directories:
      - /test/fixtures/adapters-package-vite
      - /test/fixtures/attachment-owner-document
      - /test/fixtures/backbone-adapter-types
      - /test/fixtures/cjs-adapters
      - /test/fixtures/cjs-node
      - /test/fixtures/collection-removal-survivors
      - /test/fixtures/consumer-lint
      - /test/fixtures/core-no-underscore
      - /test/fixtures/core-types
      - /test/fixtures/data-package-cjs
      - /test/fixtures/data-package-esm
      - /test/fixtures/data-package-starter
      - /test/fixtures/data-package-types
      - /test/fixtures/data-package-vite
      - /test/fixtures/docs-package
      - /test/fixtures/docs-quick-start
      - /test/fixtures/dom-adapters-package
      - /test/fixtures/esm-node
      - /test/fixtures/jquery-dom-api
      - /test/fixtures/jquery-dom-api-types
      - /test/fixtures/no-default-export
      - /test/fixtures/removed-core-adapters
      - /test/fixtures/standalone-packages
      - /test/fixtures/utils-package
      - /test/fixtures/vite
      - /test/fixtures/xstate-adapter-types
      - /packages/test/examples
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      consumer-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: marionette
      - dependency-name: '@mnjs/*'
      # Keep TS6 compiler-API and consumer coverage; TS7 uses explicit aliases.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: typescript-7
        update-types: [version-update:semver-major]
  # Only the isolated minimum-version fixture keeps Backbone fixed.
  - package-ecosystem: npm
    directory: /test/fixtures/backbone-adapter
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: backbone
  - package-ecosystem: npm
    directory: /packages/html
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      html-tooling:
        dependency-type: development
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Update the released compatibility baseline deliberately, not with tooling.
      - dependency-name: marionette
      # Preserve verified upstream provenance until a reviewed source update.
      - dependency-name: lit-html
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
