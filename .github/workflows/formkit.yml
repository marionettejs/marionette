name: FormKit package

on:
  pull_request:
    paths:
      - 'packages/formkit/**'
      - '.github/workflows/formkit.yml'
      - '.nvmrc'
      - 'config/release-profile.json'
      - 'scripts/checks/release-profile.mjs'
      - 'scripts/release/packages.mjs'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [master]
    paths:
      - 'packages/formkit/**'
      - '.github/workflows/formkit.yml'
      - '.nvmrc'
      - 'config/release-profile.json'
      - 'scripts/checks/release-profile.mjs'
      - 'scripts/release/packages.mjs'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  verify:
    name: Private FormKit package against released peers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/formkit/package-lock.json
      - name: Verify source toolchain
        run: npm run check:release-profile -- --host linux-x64 --runner ubuntu-24.04
      # The package lint command loads the repository ESLint configuration.
      # No root build or release step runs; FormKit stays outside workspaces.
      - name: Install repository lint tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install isolated package dependencies
        run: npm --prefix packages/formkit ci --ignore-scripts --no-audit --no-fund --workspaces=false
      - name: Verify bindings, lint, build, tests, types and packed consumers
        run: npm --prefix packages/formkit run check
      - name: Measure active runtime coverage
        run: npm --prefix packages/formkit run coverage
      - name: Read consumer Node floors from the release profile
        id: consumer-floors
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const { source } = JSON.parse(readFileSync('config/release-profile.json', 'utf8'));
          const { engines } = JSON.parse(readFileSync('packages/formkit/package.json', 'utf8'));
          assert.equal(engines.node, source.consumerNodeRange);
          const [, node22, node24] = engines.node.match(/^\^(22\.\d+\.\d+) \|\| >=(24\.\d+\.\d+)$/) ?? [];
          for (const [key, version] of Object.entries({ node22, node24 })) {
            assert.ok(version && source.consumerNodeVersions.includes(version), `Unapproved consumer floor: ${key}`);
            console.log(`${key}=${version}`);
          }
          NODE
      - name: Set up the Node 22 floor
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.consumer-floors.outputs.node22 }}
      - name: Verify clean npm consumer at the Node 22 floor
        run: node packages/formkit/scripts/check-clean-consumer.mjs
      - name: Set up the Node 24 floor
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.consumer-floors.outputs.node24 }}
      - name: Verify clean npm consumer at the Node 24 floor
        run: node packages/formkit/scripts/check-clean-consumer.mjs
      - name: Retain package verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formkit-validation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            packages/formkit/test/tmp/lint-result.json
            packages/formkit/test/tmp/package-result.json
            packages/formkit/test/tmp/clean-consumer-*.json
            packages/formkit/coverage/coverage-summary.json
            packages/formkit/coverage/graph-result.json
            packages/formkit/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  browser:
    name: Public FormKit browser peer contracts
    # Use a supported VM rather than the job container: the Chromium sandbox
    # needs user namespaces, unavailable in the browser container.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/formkit/package-lock.json
      - name: Install browser tooling and locked peers
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/formkit ci --ignore-scripts --no-audit --no-fund --workspaces=false
      - name: Install browsers pinned by the root lockfile
        run: node node_modules/playwright/cli.js install --with-deps
      - name: Build and pack the exact FormKit candidate
        run: |
          mkdir -p packages/formkit/test/tmp/browser
          npm --prefix packages/formkit run build
          (cd packages/formkit && npm pack --ignore-scripts --pack-destination test/tmp/browser --json > test/tmp/browser/pack.json)
      - name: Verify keyboard and composition contracts
        run: node packages/formkit/test/browser/browser.mjs
      - name: Verify validation and full Core disposal in Chromium
        timeout-minutes: 4
        env:
          FORMKIT_BENCH_READINESS: '1'
          FORMKIT_BENCH_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node packages/formkit/test/browser/benchmark/run-samples.mjs
      - name: Profile public FormKit renderer and retention
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 3850 && github.event.pull_request.draft
        continue-on-error: true
        timeout-minutes: 6
        env:
          FORMKIT_BENCH_PROFILE: '1'
          FORMKIT_BENCH_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node packages/formkit/test/browser/benchmark/run-samples.mjs
      - name: Retain public browser receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formkit-public-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: packages/formkit/test/tmp/browser/*-results.json
          if-no-files-found: warn
          retention-days: 14
