name: FormKit synthetic package verification

on:
  push:
    branches: [codex/formkit-synthetic-ci-20261123]

permissions:
  contents: read

concurrency:
  group: formkit-synthetic-ci-20261123
  cancel-in-progress: false

jobs:
  preflight:
    name: Exact FormKit package (${{ matrix.arm }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arm: [baseline, candidate]
    env:
      ARM: ${{ matrix.arm }}
      MNJS_SKIP_PREPARE: '1'
      BASELINE: 660d5beb697379faa39b023c9fbce8d0bf2122a4
      PATCH_SHA: 1062ab4c4e64017bd6017da3a63ccd9f87b92263dc995f0f4b643e3ff2c7e2d5
    steps:
      - name: Checkout CI-only commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 8
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Verify inputs and check out both immutable source variations
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASELINE" HEAD
          mkdir -p "$RUNNER_TEMP/formkit-evidence"
          patch=.github/benchmarks/formkit-initial-placement-v4.patch
          echo "$PATCH_SHA  $patch" | sha256sum -c -
          git worktree add --detach "$RUNNER_TEMP/formkit-baseline" "$BASELINE"
          git worktree add --detach "$RUNNER_TEMP/formkit-candidate" "$BASELINE"
          git -C "$RUNNER_TEMP/formkit-candidate" apply --index "$GITHUB_WORKSPACE/$patch"
          {
            echo "driver_commit=$GITHUB_SHA"
            echo "base_commit=$BASELINE"
            echo "base_tree=$(git -C "$RUNNER_TEMP/formkit-baseline" rev-parse HEAD^{tree})"
            echo "candidate_tree=$(git -C "$RUNNER_TEMP/formkit-candidate" write-tree)"
            echo "patch_sha256=$PATCH_SHA"
            echo "runner=$RUNNER_OS/$RUNNER_ARCH"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "kernel=$(uname -sr)"
            echo "logical_cpus=$(nproc)"
            awk '/^MemTotal:/ { print "memory_kib=" $2 }' /proc/meminfo
            sha256sum package-lock.json packages/formkit/package-lock.json
          } > "$RUNNER_TEMP/formkit-evidence/provenance.txt"
          npm run check:release-profile -- --host linux-x64 --runner ubuntu-24.04
          echo "browser_and_timing=not_run" >> "$RUNNER_TEMP/formkit-evidence/provenance.txt"
      - name: Verify the locked standalone package
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/formkit-$ARM"
          npm --prefix "$root" ci --ignore-scripts --no-audit --no-fund
          npm --prefix "$root/packages/formkit" ci --ignore-scripts --no-audit --no-fund --workspaces=false
          npm --prefix "$root/packages/formkit" run check 2>&1 | tee "$RUNNER_TEMP/formkit-evidence/package-check.log"
      - name: Exercise placement and cleanup on the exact candidate
        if: matrix.arm == 'candidate'
        shell: bash
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/formkit-candidate/packages/formkit"
          cp .github/benchmarks/formkit-initial-placement.spec.mjs "$pkg/test/synthetic-initial-placement.spec.mjs"
          cd "$pkg"
          npm test -- test/synthetic-initial-placement.spec.mjs 2>&1 | tee "$RUNNER_TEMP/formkit-evidence/placement-check.log"
      - name: Hash the verified pack and record released peer pins
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/formkit-$ARM"
          mkdir "$RUNNER_TEMP/formkit-pack"
          cd "$root/packages/formkit"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/formkit-pack" --json > "$RUNNER_TEMP/formkit-evidence/package-pack.json"
          node -e 'let l=require("./package-lock.json"); for(let [p,v] of Object.entries(l.packages)) if (/^node_modules\/(?:marionette|@formkit\/[^/]+|@mnjs\/(?:utils|radio))$/.test(p)) console.log(p,v.version,v.integrity)' > "$RUNNER_TEMP/formkit-evidence/peer-integrity.txt"
          (cd "$RUNNER_TEMP/formkit-pack" && sha256sum ./*.tgz) > "$RUNNER_TEMP/formkit-evidence/pack-sha256.txt"
      - name: Retain package-only reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: formkit-synthetic-package-${{ matrix.arm }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/formkit-evidence/
          if-no-files-found: warn
          retention-days: 7
