name: FormKit synthetic hosted correctness

on:
  push:
    branches: [codex/formkit-synthetic-ci-20261123]

permissions:
  contents: read

concurrency:
  group: formkit-synthetic-ci-20261123
  cancel-in-progress: false

jobs:
  # Exact package-only evidence remains in the previous workflow run.
  preflight:
    if: ${{ false }}
    name: Exact FormKit package (${{ matrix.arm }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arm: [baseline, candidate]
    env:
      ARM: ${{ matrix.arm }}
      MNJS_SKIP_PREPARE: '1'
      BASELINE: 660d5beb697379faa39b023c9fbce8d0bf2122a4
      PATCH_SHA: 1062ab4c4e64017bd6017da3a63ccd9f87b92263dc995f0f4b643e3ff2c7e2d5
    steps:
      - name: Checkout CI-only commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 8
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Verify inputs and check out both immutable source variations
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASELINE" HEAD
          mkdir -p "$RUNNER_TEMP/formkit-evidence"
          patch=.github/benchmarks/formkit-initial-placement-v4.patch
          echo "$PATCH_SHA  $patch" | sha256sum -c -
          git worktree add --detach "$RUNNER_TEMP/formkit-baseline" "$BASELINE"
          git worktree add --detach "$RUNNER_TEMP/formkit-candidate" "$BASELINE"
          git -C "$RUNNER_TEMP/formkit-candidate" apply --index "$GITHUB_WORKSPACE/$patch"
          {
            echo "driver_commit=$GITHUB_SHA"
            echo "base_commit=$BASELINE"
            echo "base_tree=$(git -C "$RUNNER_TEMP/formkit-baseline" rev-parse HEAD^{tree})"
            echo "candidate_tree=$(git -C "$RUNNER_TEMP/formkit-candidate" write-tree)"
            echo "patch_sha256=$PATCH_SHA"
            echo "runner=$RUNNER_OS/$RUNNER_ARCH"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "kernel=$(uname -sr)"
            echo "logical_cpus=$(nproc)"
            awk '/^MemTotal:/ { print "memory_kib=" $2 }' /proc/meminfo
            sha256sum package-lock.json packages/formkit/package-lock.json
          } > "$RUNNER_TEMP/formkit-evidence/provenance.txt"
          npm run check:release-profile -- --host linux-x64 --runner ubuntu-24.04
          echo "browser_and_timing=not_run" >> "$RUNNER_TEMP/formkit-evidence/provenance.txt"
      - name: Verify the locked standalone package
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/formkit-$ARM"
          npm --prefix "$root" ci --ignore-scripts --no-audit --no-fund
          npm --prefix "$root/packages/formkit" ci --ignore-scripts --no-audit --no-fund --workspaces=false
          npm --prefix "$root/packages/formkit" run check 2>&1 | tee "$RUNNER_TEMP/formkit-evidence/package-check.log"
      - name: Exercise placement and cleanup on the exact candidate
        if: matrix.arm == 'candidate'
        shell: bash
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/formkit-candidate/packages/formkit"
          cp .github/benchmarks/formkit-initial-placement.spec.mjs "$pkg/test/synthetic-initial-placement.spec.mjs"
          cd "$pkg"
          npm test -- test/synthetic-initial-placement.spec.mjs 2>&1 | tee "$RUNNER_TEMP/formkit-evidence/placement-check.log"
      - name: Hash the verified pack and record released peer pins
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/formkit-$ARM"
          mkdir "$RUNNER_TEMP/formkit-pack"
          cd "$root/packages/formkit"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/formkit-pack" --json > "$RUNNER_TEMP/formkit-evidence/package-pack.json"
          node -e 'let l=require("./package-lock.json"); for(let [p,v] of Object.entries(l.packages)) if (/^node_modules\/(?:marionette|@formkit\/[^/]+|@mnjs\/(?:utils|radio))$/.test(p)) console.log(p,v.version,v.integrity)' > "$RUNNER_TEMP/formkit-evidence/peer-integrity.txt"
          (cd "$RUNNER_TEMP/formkit-pack" && sha256sum ./*.tgz) > "$RUNNER_TEMP/formkit-evidence/pack-sha256.txt"
      - name: Retain package-only reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: formkit-synthetic-package-${{ matrix.arm }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/formkit-evidence/
          if-no-files-found: warn
          retention-days: 7

  macos-sandbox:
    name: Sandboxed Chromium synthetic correctness (GitHub-hosted macOS arm64)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      MNJS_SKIP_PREPARE: '1'
    steps:
      - name: Checkout isolated synthetic preflight source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 8
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Verify source profile and install pinned launcher
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/formkit-evidence"
          {
            echo "driver_commit=$GITHUB_SHA"
            echo "runner=$RUNNER_OS/$RUNNER_ARCH"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "os=$(sw_vers -productVersion)"
            echo "mode=real_browser_correctness_only_not_a_benchmark"
            shasum -a 256 package-lock.json
          } > "$RUNNER_TEMP/formkit-evidence/provenance.txt"
          npm run check:release-profile -- --host macos-arm64 --runner macos-15
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Install exact lockfile Chromium
        run: PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/formkit-chromium" npx --no-install playwright install chromium
      - name: Require sandbox-enabled browser preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/formkit-profile"/{config,cache,tmp}
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/formkit-chromium"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/formkit-profile/config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/formkit-profile/cache"
          export TMPDIR="$RUNNER_TEMP/formkit-profile/tmp"
          export BROWSER_EVIDENCE="$RUNNER_TEMP/formkit-evidence/browser-preflight.json"
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { readFile, realpath, writeFile } from 'node:fs/promises';
          import { chromium } from '@playwright/test';

          const binary = await realpath(chromium.executablePath());
          const binarySha256 = createHash('sha256').update(await readFile(binary)).digest('hex');
          const launch = { headless: true, chromiumSandbox: true, executablePath: binary, args: ['--enable-automation'] };
          const evidence = { binarySha256, chromiumSandbox: true, headless: true, outcome: 'failed' };
          try {
            const browser = await chromium.launch(launch);
            try {
              evidence.browserVersion = browser.version();
              const page = await browser.newPage();
              await page.setContent('<main>Sandbox preflight</main>');
              if (await page.locator('main').textContent() !== 'Sandbox preflight') {
                throw new Error('Renderer smoke failed');
              }
              evidence.rendererSmoke = 'passed';

              const cdp = await browser.newBrowserCDPSession();
              const { arguments: args } = await cdp.send('Browser.getBrowserCommandLine');
              if (!Array.isArray(args) || !args.includes('--enable-automation')) {
                throw new Error('Browser command-line audit was not enabled');
              }
              // Retain observed switch names; omit ephemeral runner/temporary profile paths and values.
              evidence.observedSwitches = args.filter((arg) => arg.startsWith('--')).map((arg) => arg.split('=', 1)[0]);
              const disablingArgs = args.filter((arg) =>
                /^--(?:no-sandbox|disable-setuid-sandbox|disable-seccomp-filter-sandbox|disable-namespace-sandbox|disable-gpu-sandbox|allow-sandbox-debugging)(?:=|$)/.test(arg));
              if (disablingArgs.length) throw new Error('Sandbox-disabled browser command line');
              evidence.outcome = 'passed';
            } finally {
              await browser.close();
            }
          } catch (error) {
            console.error(error);
            process.exitCode = 1;
          } finally {
            await writeFile(process.env.BROWSER_EVIDENCE, JSON.stringify(evidence, null, 2) + '\n');
          }
          JS
      - name: Assemble exact packs and locked public study dependencies
        shell: bash
        run: |
          set -euo pipefail
          base=660d5beb697379faa39b023c9fbce8d0bf2122a4
          patch="$GITHUB_WORKSPACE/.github/benchmarks/formkit-initial-placement-v4.patch"
          study="$GITHUB_WORKSPACE/.github/benchmarks/formkit-study-v1"
          report="$RUNNER_TEMP/formkit-evidence"
          git merge-base --is-ancestor "$base" HEAD
          (cd "$study"; echo '6f1c22e5fb834d3935002b3014947b5ee0f66bc17a2bbe847639ab193b4565d0  package-lock.json' | shasum -a 256 -c -)
          echo "1062ab4c4e64017bd6017da3a63ccd9f87b92263dc995f0f4b643e3ff2c7e2d5  $patch" | shasum -a 256 -c -
          git worktree add --detach "$RUNNER_TEMP/formkit-base" "$base"
          git worktree add --detach "$RUNNER_TEMP/formkit-v4" "$base"
          git -C "$RUNNER_TEMP/formkit-v4" apply --index "$patch"
          printf 'base_tree=%s\ncandidate_tree=%s\n' \
            "$(git -C "$RUNNER_TEMP/formkit-base" rev-parse HEAD^{tree})" \
            "$(git -C "$RUNNER_TEMP/formkit-v4" write-tree)" >> "$report/provenance.txt"
          for arm in baseline candidate; do
            if [[ "$arm" = baseline ]]; then checkout=formkit-base; else checkout=formkit-v4; fi
            package="$RUNNER_TEMP/$checkout/packages/formkit"
            pack="$RUNNER_TEMP/$arm-pack"
            mkdir -p "$pack" "$study/packs/$arm"
            (
              cd "$package"
              npm ci --ignore-scripts --no-audit --no-fund --workspaces=false
              npm run build
              npm pack --ignore-scripts --pack-destination "$pack"
            )
            (cd "$pack"; shasum -a 256 ./*.tgz) > "$report/$arm-pack-sha256.txt"
            tar -xzf "$pack"/*.tgz -C "$study/packs/$arm"
          done
          cd "$study"
          npm ci --ignore-scripts --no-audit --no-fund
          node build.mjs
          shasum -a 256 package-lock.json fixture.mjs run-correctness.mjs > "$report/harness-hashes.txt"
          find dist -type f -print0 | xargs -0 shasum -a 256 >> "$report/harness-hashes.txt"
      - name: Verify all 24 public synthetic workload cells (no timings)
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/formkit-chromium"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/formkit-profile/config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/formkit-profile/cache"
          export TMPDIR="$RUNNER_TEMP/formkit-profile/tmp"
          export FORMKIT_STUDY_REPORT="$RUNNER_TEMP/formkit-evidence/correctness.json"
          node .github/benchmarks/formkit-study-v1/run-correctness.mjs
      - name: Retain preflight and correctness-only evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: formkit-synthetic-macos-correctness-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/formkit-evidence/
          if-no-files-found: warn
          retention-days: 7
