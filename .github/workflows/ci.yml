name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node 24
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release profile
        run: npm run check:release-profile -- --host linux-x64 --runner ubuntu-24.04

      - name: Verify release promotion policy
        run: npm run check:release-promotion

      - name: Install dependencies
        run: npm ci

      - name: Verify browser profile
        run: npm run check:browser-profile

      - name: Verify diagnostic catalog
        run: npm run check:diagnostics

      - name: Test source ESM
        run: npm run test:source

      - name: Lint
        run: npm run lint:ci

      - name: Verify distributable artifacts
        run: npm run check:dist

      - name: Coverage
        run: npm run coverage

      - name: Test package fixtures
        run: npm run test:fixtures

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-node-24
          path: coverage/
          if-no-files-found: warn

  package-smoke:
    name: Package smoke (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            host: macos-arm64
            runner: macos-15
          - name: Windows x64
            host: windows-x64
            runner: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release profile
        run: npm run check:release-profile -- --host ${{ matrix.host }} --runner ${{ matrix.runner }}

      - name: Install dependencies
        run: npm ci

      - name: Test package fixtures
        run: npm run test:fixtures

  size:
    name: Bundle size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release profile
        run: npm run check:release-profile -- --host linux-x64 --runner ubuntu-24.04

      - name: Install dependencies
        run: npm ci

      - name: Build current branch
        run: npm run build

      - name: Check bundle-size budgets
        id: bundle_size
        continue-on-error: true
        run: node config/bundle-size.mjs --json > bundle-size-current.json

      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: bundle-size-base
          persist-credentials: false

      - name: Build base branch
        working-directory: bundle-size-base
        run: |
          npm ci
          npm run build

      - name: Compare bundle sizes
        run: |
          node config/bundle-size.mjs --root bundle-size-base --json --no-enforce > bundle-size-base.json
          node config/bundle-size.mjs --report bundle-size-base.json bundle-size-current.json > bundle-size-report.md
          cat bundle-size-report.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload bundle-size report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-size-report
          path: bundle-size-report.md
          if-no-files-found: error
          retention-days: 1

      - name: Enforce bundle-size budgets
        if: steps.bundle_size.outcome == 'failure'
        run: exit 1
