name: CI
run-name: >-
  ${{ github.event_name == 'pull_request' && format('CI PR #{0} base {1} head {2}', github.event.pull_request.number, github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('CI {0}', github.ref_name) }}

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node 24
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release profile
        run: npm run check:release-profile -- --host linux-x64 --runner ubuntu-24.04

      - name: Verify release promotion policy
        run: npm run check:release-promotion

      - name: Install dependencies
        run: npm ci

      - name: Verify browser profile
        run: npm run check:browser-profile

      - name: Verify diagnostic catalog
        run: npm run check:diagnostics

      - name: Test performance contract
        run: npm run test:performance

      - name: Test source ESM
        run: npm run test:source

      - name: Lint
        run: npm run lint:ci

      - name: Verify distributable artifacts
        run: npm run check:dist

      - name: Install supported browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test supported browsers
        run: npm run test:browser

      - name: Coverage
        run: npm run coverage

      - name: Test package fixtures
        run: npm run test:fixtures

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-node-24
          path: coverage/
          if-no-files-found: warn

  package-smoke:
    name: Package smoke (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            host: macos-arm64
            runner: macos-15
          - name: Windows x64
            host: windows-x64
            runner: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release profile
        run: npm run check:release-profile -- --host ${{ matrix.host }} --runner ${{ matrix.runner }}

      - name: Install dependencies
        run: npm ci

      - name: Test package fixtures
        run: npm run test:fixtures

  size:
    name: Bundle size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release profile
        run: npm run check:release-profile -- --host linux-x64 --runner ubuntu-24.04

      - name: Install dependencies
        run: npm ci

      - name: Build current branch
        run: npm run build

      - name: Prepare performance workspace
        id: performance_workspace
        run: |
          set -euo pipefail
          performance_dir="$(mktemp -d "${RUNNER_TEMP}/marionette-growth-approval.XXXXXX")"
          chmod 700 "${performance_dir}"
          echo "directory=${performance_dir}" >> "${GITHUB_OUTPUT}"

      - name: Check current performance contract
        id: current_contract
        continue-on-error: true
        env:
          PERFORMANCE_DIR: ${{ steps.performance_workspace.outputs.directory }}
        run: |
          set -euo pipefail
          node scripts/performance/bundle-size.mjs --json > "${PERFORMANCE_DIR}/bundle-size-current.json"

      - name: Collect performance growth approval records
        env:
          GH_TOKEN: ${{ github.token }}
          PERFORMANCE_DIR: ${{ steps.performance_workspace.outputs.directory }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          TRACKING_ISSUE_NUMBER: 127
        run: |
          set -euo pipefail
          pull_request_status='ok'
          if ! gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${REPOSITORY}/issues/${PULL_REQUEST_NUMBER}/comments?per_page=100" \
            > "${PERFORMANCE_DIR}/pull-request-pages.json"; then
            pull_request_status='unavailable'
            echo '[]' > "${PERFORMANCE_DIR}/pull-request-pages.json"
          fi
          jq -n \
            --arg repository "${REPOSITORY}" \
            --arg status "${pull_request_status}" \
            --argjson pull_request_number "${PULL_REQUEST_NUMBER}" \
            --slurpfile pages "${PERFORMANCE_DIR}/pull-request-pages.json" \
            '{
              schemaVersion: 1,
              status: $status,
              repository: $repository,
              pullRequestNumber: $pull_request_number,
              comments: ($pages[0] | add // [])
            }' > "${PERFORMANCE_DIR}/approval-comments.json"

          issue_status='ok'
          if ! gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${REPOSITORY}/issues/${TRACKING_ISSUE_NUMBER}/comments?per_page=100" \
            > "${PERFORMANCE_DIR}/tracking-issue-pages.json"; then
            issue_status='unavailable'
            echo '[]' > "${PERFORMANCE_DIR}/tracking-issue-pages.json"
          fi
          jq -n \
            --arg repository "${REPOSITORY}" \
            --arg status "${issue_status}" \
            --argjson issue_number "${TRACKING_ISSUE_NUMBER}" \
            --slurpfile pages "${PERFORMANCE_DIR}/tracking-issue-pages.json" \
            '{
              schemaVersion: 1,
              status: $status,
              repository: $repository,
              issueNumber: $issue_number,
              comments: ($pages[0] | add // [])
            }' > "${PERFORMANCE_DIR}/growth-evidence-comments.json"

      - name: Checkout exact pull request base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: bundle-size-base
          persist-credentials: false

      - name: Build base branch
        working-directory: bundle-size-base
        run: |
          npm ci
          npm run build

      - name: Enforce exact base performance contract
        id: base_authority
        continue-on-error: true
        env:
          PERFORMANCE_DIR: ${{ steps.performance_workspace.outputs.directory }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          base_contract='bundle-size-base/config/performance.json'
          authority_script='bundle-size-base/scripts/performance/bundle-size.mjs'
          approval_script='bundle-size-base/scripts/performance/growth-approval.mjs'
          test -f "${base_contract}"
          test -f "${authority_script}"
          test -f "${approval_script}"

          node "${authority_script}" --root bundle-size-base --config "${base_contract}" --json --no-enforce > "${PERFORMANCE_DIR}/bundle-size-base.json"
          authority_status=0
          node "${authority_script}" --config config/performance.json --json > "${PERFORMANCE_DIR}/bundle-size-authority.json" || authority_status=$?
          candidate_status=0
          node "${authority_script}" --validate-resource-contract "${base_contract}" config/performance.json || candidate_status=$?
          approval_status=0
          node "${approval_script}" \
            --contract "${base_contract}" \
            --candidate-contract config/performance.json \
            --base-report "${PERFORMANCE_DIR}/bundle-size-base.json" \
            --current-report "${PERFORMANCE_DIR}/bundle-size-authority.json" \
            --comments "${PERFORMANCE_DIR}/approval-comments.json" \
            --evidence-comments "${PERFORMANCE_DIR}/growth-evidence-comments.json" \
            --head-sha "${PULL_REQUEST_HEAD_SHA}" \
            --pull-request "${PULL_REQUEST_NUMBER}" \
            > "${PERFORMANCE_DIR}/growth-approval.json" || approval_status=$?
          report_status=0
          node "${authority_script}" \
            --report "${PERFORMANCE_DIR}/bundle-size-base.json" "${PERFORMANCE_DIR}/bundle-size-authority.json" \
            --growth-approval "${PERFORMANCE_DIR}/growth-approval.json" \
            > "${PERFORMANCE_DIR}/bundle-size-report.md" || report_status=$?
          cat "${PERFORMANCE_DIR}/bundle-size-report.md" >> "${GITHUB_STEP_SUMMARY}"
          if [ "${authority_status}" -ne 0 ] || [ "${candidate_status}" -ne 0 ] || \
              [ "${approval_status}" -ne 0 ] || [ "${report_status}" -ne 0 ]; then
            exit 1
          fi

      - name: Upload bundle-size report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-size-report
          path: ${{ steps.performance_workspace.outputs.directory }}/bundle-size-report.md
          if-no-files-found: error
          retention-days: 1

      - name: Enforce bundle-size budgets
        if: steps.current_contract.outcome == 'failure' || steps.base_authority.outcome == 'failure'
        run: exit 1

  performance-timing:
    name: Performance timing (reporting only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release profile
        run: npm run check:release-profile -- --host linux-x64 --runner ubuntu-24.04

      - name: Install dependencies
        run: npm ci

      - name: Build current branch
        run: npm run build

      - name: Checkout exact pull request base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: performance-base
          persist-credentials: false

      - name: Build pull request base
        working-directory: performance-base
        run: |
          npm ci
          npm run build

      - name: Measure hosted timing
        run: |
          set -euo pipefail
          current_timing_script='scripts/performance/timing.mjs'
          base_timing_script='performance-base/scripts/performance/timing.mjs'
          test -f "${base_timing_script}"
          node "${base_timing_script}" --root performance-base --config performance-base/config/performance.json --json > performance-timing-base.json
          node "${current_timing_script}" --config config/performance.json --json > performance-timing-current.json
          node "${current_timing_script}" --report performance-timing-base.json performance-timing-current.json > performance-timing-report.md
          cat performance-timing-report.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload hosted timing report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-timing-report
          path: performance-timing-report.md
          if-no-files-found: error
          retention-days: 1
