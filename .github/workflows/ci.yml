name: CI
run-name: >-
  ${{ github.event_name == 'pull_request' && format('CI PR #{0} base {1} head {2}', github.event.pull_request.number, github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('CI {0}', github.ref_name) }}

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  MNJS_SKIP_PREPARE: '1'

jobs:
  candidate:
    name: Build immutable candidate
    runs-on: ubuntu-24.04
    outputs:
      build_sha256: ${{ steps.outputs.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release profile
        run: npm run check:release-profile -- --host linux-x64 --runner ubuntu-24.04

      - name: Install dependencies
        run: npm ci

      - name: Build and pack once from clean source
        run: npm run release:artifact -- --validation-only --output test/tmp/candidate

      - name: Prepare independent HTML renderer
        run: npm run docs:prepare-html

      - name: Capture compiled outputs
        id: outputs
        run: npm run release:outputs -- --mode capture

      - name: Upload candidate before validation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.sha }}
          path: test/tmp/candidate/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload compiled outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-outputs-${{ github.sha }}
          path: test/tmp/build-outputs/
          if-no-files-found: error
          retention-days: 7

  source-checks:
    name: Fast source checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source contracts
        run: |
          npm run check:release-profile -- --host linux-x64 --runner ubuntu-24.04
          npm run check:browser-profile
          npm run check:api-contracts
          npm run check:public-tests
          npm run check:workflows
          npm run lint:ci

  core:
    name: Core (Node 24)
    needs: candidate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release profile
        run: npm run check:release-profile -- --host linux-x64 --runner ubuntu-24.04

      - name: Verify release promotion policy
        run: npm run check:release-promotion

      - name: Install dependencies
        run: npm ci

      - name: Restore exact candidate
        uses: ./.github/actions/restore-candidate
        with:
          source-sha: ${{ github.sha }}
          build-sha256: ${{ needs.candidate.outputs.build_sha256 }}

      - name: Test packed testing-helper consumer (DOM)
        run: npm run test:helpers:consumer

      - name: Test optional packages standalone and against minimum/candidate core
        run: npm run test:package-compatibility -- --artifact-dir test/tmp/candidate

      - name: Test router package and installed archive
        run: npm run test:router-package && npm run test:router-tarball -- --artifact-dir test/tmp/candidate

      - name: Verify diagnostic catalog
        run: npm run check:diagnostics

      - name: Test source ESM
        run: npm run test:source

      - name: Coverage
        run: npm run coverage

      - name: Validate documentation and agent resources
        run: npm run docs:check && npm run test:agent-docs
        env:
          MARIONETTE_ARTIFACT_DIR: ${{ github.workspace }}/test/tmp/candidate

      - name: Upload suite reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-node-24
          path: |
            coverage/
            test/tmp/unit-results.xml
            test/tmp/test-package-consumer/
          if-no-files-found: warn

  tooling:
    name: Tooling (Node 24)
    needs: candidate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release profile
        run: npm run check:release-profile -- --host linux-x64 --runner ubuntu-24.04

      - name: Install dependencies
        run: npm ci

      - name: Restore exact candidate
        uses: ./.github/actions/restore-candidate
        with:
          source-sha: ${{ github.sha }}
          build-sha256: ${{ needs.candidate.outputs.build_sha256 }}

      - name: Test tooling with separate coverage
        run: npm run coverage:tooling

      - name: Upload suite reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tooling-node-24
          # Keep rendered reports; c8's raw V8 data is only needed during generation.
          path: |
            coverage/tooling/
            !coverage/tooling/tmp/
          if-no-files-found: warn
          retention-days: 7

  browsers:
    name: Browsers (Node 24)
    needs: candidate
    runs-on: ubuntu-24.04
    container:
      # Keep the image version/digest aligned with the Playwright lockfiles.
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --user 1001:1001 --shm-size=1g
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      MARIONETTE_BROWSER_ARTIFACT_MANIFEST: ${{ github.workspace }}/test/tmp/candidate/release-evidence.json

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release profile
        run: npm run check:release-profile -- --host linux-x64 --runner ubuntu-24.04

      - name: Install dependencies
        run: npm ci

      - name: Restore exact candidate
        uses: ./.github/actions/restore-candidate
        with:
          source-sha: ${{ github.sha }}
          build-sha256: ${{ needs.candidate.outputs.build_sha256 }}

      - name: Verify provisioned browsers
        timeout-minutes: 2
        run: node scripts/checks/provisioned-browsers.mjs

      - name: Test supported browsers
        id: browser_suite
        run: npm run test:browser

      - name: Trace native Router contract failures separately
        if: ${{ !cancelled() && steps.browser_suite.outcome != 'skipped' }}
        run: npm run test:browser -- --config playwright.router-diagnostics.config.mjs

      - name: Validate native browser performance workloads
        run: npm run test:browser-performance

      - name: Upload suite reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browsers-node-24
          path: |
            test/tmp/router-diagnostics/
            test/tmp/browser/results.json
            test/tmp/browser/results.xml
            test/tmp/browser/report/
            test/tmp/browser/results/
            test/tmp/performance/browser-report.json
          if-no-files-found: warn

  router-browser-candidate:
    name: Router archive producer (Linux x64)
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.candidate.outputs.source_sha }}
      archive_sha256: ${{ steps.candidate.outputs.archive_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release profile
        run: npm run check:release-profile -- --host linux-x64 --runner ubuntu-24.04

      - name: Install dependencies
        run: npm ci

      - name: Download compiled outputs from the candidate producer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-outputs-${{ github.sha }}
          path: test/tmp/build-outputs

      - name: Prepare the exact Router archive from clean canonical source
        id: candidate
        env:
          BUILD_OUTPUT_SHA256: ${{ needs.candidate.outputs.build_sha256 }}
        run: |
          npm run router:prepare -- --output "${RUNNER_TEMP}/router-browser-candidate" --build-sha256 "$BUILD_OUTPUT_SHA256"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const receipt = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'router-browser-candidate/router-candidate.json')));
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          assert.equal(receipt.sourceCommit, head);
          assert.equal(receipt.sourceDirty, false);
          assert.match(receipt.archive.sha256, /^[a-f0-9]{64}$/);
          appendFileSync(process.env.GITHUB_OUTPUT, 'source_sha=' + head + '\narchive_sha256=' + receipt.archive.sha256 + '\n');
          JS

      - name: Transfer the archive and adjacent preparation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: router-browser-candidate
          path: ${{ runner.temp }}/router-browser-candidate/
          if-no-files-found: error

  router-browsers:
    name: Router archive browsers (macOS arm64)
    needs: router-browser-candidate
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout the exact archive producer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.router-browser-candidate.outputs.source_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release profile
        run: npm run check:release-profile -- --host macos-arm64 --runner macos-15

      - name: Install dependencies
        run: npm ci

      - name: Prepare published HTML renderer
        run: npm run docs:prepare-html

      - name: Receive the exact Linux-produced Router archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: router-browser-candidate
          path: ${{ runner.temp }}/router-browser-candidate

      - name: Install pinned browser binaries
        run: npx --no-install playwright install chromium firefox webkit

      - name: Verify configured engine launches and diagnose raw behavior
        continue-on-error: true # Raw diagnostics do not suppress the installed suites.
        run: node test/router/browser-probes.mjs

      - name: Test exact installed Router archive on all engines
        env:
          MARIONETTE_ROUTER_BROWSER_PROBES: test/tmp/router-browser-probes.json
          ROUTER_SOURCE_SHA: ${{ needs.router-browser-candidate.outputs.source_sha }}
          ROUTER_ARCHIVE_SHA256: ${{ needs.router-browser-candidate.outputs.archive_sha256 }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync, spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { dirname, join, resolve } from 'node:path';
          const git = args => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const source = process.env.ROUTER_SOURCE_SHA;
          const directory = resolve(process.env.RUNNER_TEMP, 'router-browser-candidate');
          // This lane requires the adjacent receipt; absence cannot mean null provenance.
          const prepared = JSON.parse(readFileSync(join(directory, 'router-candidate.json')));
          const archive = resolve(directory, prepared.archive.file);
          const output = join(process.env.RUNNER_TEMP, 'router-browser-verification');
          assert.equal(dirname(archive), directory);
          assert.equal(git(['rev-parse', 'HEAD']), source);
          assert.equal(git(['status', '--porcelain', '--untracked-files=all']), '');
          assert.equal(prepared.sourceCommit, source);
          assert.equal(prepared.sourceDirty, false);
          assert.equal(prepared.archive.sha256, process.env.ROUTER_ARCHIVE_SHA256);
          assert.equal(createHash('sha256').update(readFileSync(archive)).digest('hex'), process.env.ROUTER_ARCHIVE_SHA256);
          const run = spawnSync('npm', ['run', 'test:router-tarball', '--', '--artifact', archive,
            '--sha256', process.env.ROUTER_ARCHIVE_SHA256, '--registry-peers', '--browser', '--output', output], { stdio: 'inherit' });
          assert.equal(git(['status', '--porcelain', '--untracked-files=all']), '');
          assert.equal(run.error, undefined);
          assert.equal(run.status, 0);
          const verified = JSON.parse(readFileSync(join(output, 'router-verification.json')));
          assert.equal(verified.status, 'passed-public-candidate');
          assert.equal(verified.archiveSourceCommit, source);
          assert.equal(verified.verificationCommit, source);
          assert.equal(verified.verificationDirty, false);
          assert.equal(verified.host.platform, 'darwin');
          assert.equal(verified.host.architecture, 'arm64');
          assert.deepEqual(verified.lazyHistory.browser.engines.map(entry => entry.name).sort(), ['chromium', 'firefox', 'webkit']);
          for (const entry of verified.lazyHistory.browser.engines) {
            assert.equal(entry.status, 'passed');
            assert.deepEqual(entry.branches.map(branch => branch.mode), ['available', 'undefined', 'throwing']);
          }
          console.log('Router standalone evidence: ' + JSON.stringify({
            sourceCommit: verified.verificationCommit, archiveSha256: verified.archive.sha256,
            host: verified.host, vite: verified.lazyHistory.vite,
            staticClosure: verified.lazyHistory.staticClosure,
            historyExclusiveAssets: verified.lazyHistory.historyExclusiveAssets,
            chunks: verified.lazyHistory.chunks.map(({ file, bytes, imports, dynamicImports, implementations }) =>
              ({ file, bytes, imports, dynamicImports, implementations })),
            browser: verified.lazyHistory.browser,
          }));
          JS

      - name: Retain complete or partial Router evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: router-browsers-node-24
          path: |
            ${{ runner.temp }}/router-browser-verification/
            ${{ runner.temp }}/router-browser-candidate/
            test/tmp/router-browser/
            test/tmp/router-browser-probes.json
          if-no-files-found: warn

  agent-reference:
    name: Agent reference (Node 24)
    needs: candidate
    runs-on: ubuntu-24.04
    container:
      # Keep the image version/digest aligned with the Playwright lockfiles.
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --user 1001:1001 --shm-size=1g
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      MARIONETTE_BROWSER_ARTIFACT_MANIFEST: ${{ github.workspace }}/test/tmp/candidate/release-evidence.json

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release profile
        run: npm run check:release-profile -- --host linux-x64 --runner ubuntu-24.04

      - name: Install dependencies
        run: npm ci

      - name: Restore exact candidate
        uses: ./.github/actions/restore-candidate
        with:
          source-sha: ${{ github.sha }}
          build-sha256: ${{ needs.candidate.outputs.build_sha256 }}

      - name: Verify provisioned browsers
        timeout-minutes: 2
        run: node scripts/checks/provisioned-browsers.mjs

      - name: Cache pinned agent reference environment
        run: npm run agent:cache

      - name: Test agent reference application
        run: npm run test:agent-app

      - name: Validate reference corpus controls
        run: |
          npm run agent:reference -- --manifest test/tmp/candidate/release-evidence.json --output test/tmp/agent-reference
          npm run agent:fixtures -- --manifest test/tmp/agent-reference/artifacts/artifact-input.json --output test/tmp/agent-fixtures

      - name: Upload suite reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-reference-node-24
          path: |
            test/tmp/agent-reference-app/
            test/tmp/agent-reference/reference-report.json
            test/tmp/agent-reference/artifacts/artifact-input.json
            test/tmp/agent-fixtures/fixture-controls.json
          if-no-files-found: warn

  linux-package-smoke:
    name: Package smoke (Linux x64)
    needs: candidate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release profile
        run: npm run check:release-profile -- --host linux-x64 --runner ubuntu-24.04

      - name: Install dependencies
        run: npm ci

      - name: Restore exact candidate
        uses: ./.github/actions/restore-candidate
        with:
          source-sha: ${{ github.sha }}
          build-sha256: ${{ needs.candidate.outputs.build_sha256 }}

      - name: Test packed consumer smoke fixtures
        if: github.event_name == 'pull_request'
        run: bash test/fixtures/smoke.sh --artifact-dir test/tmp/candidate

      - name: Test complete package fixture inventory
        if: github.event_name == 'push'
        run: npm run test:fixtures -- --artifact-dir test/tmp/candidate

      - name: Upload suite reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fixtures-node-24
          path: |
            test/tmp/fixture-reports/
          if-no-files-found: warn

  node-lts:
    name: Node 26 LTS packages
    needs: candidate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore exact candidate
        uses: ./.github/actions/restore-candidate
        with:
          source-sha: ${{ github.sha }}
          build-sha256: ${{ needs.candidate.outputs.build_sha256 }}

      - name: Setup consumer Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Test package fixtures
        run: npm run test:fixtures -- --artifact-dir test/tmp/candidate

  test:
    name: Node 24
    needs: [source-checks, core, tooling, browsers, router-browsers, agent-reference, linux-package-smoke, node-lts]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every core and consumer suite to pass
        env:
          SUITE_RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$SUITE_RESULTS"

  package-smoke:
    name: Package smoke (macOS arm64)
    needs: candidate
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release profile
        run: npm run check:release-profile -- --host macos-arm64 --runner macos-15

      - name: Install dependencies
        run: npm ci

      - name: Restore exact candidate
        uses: ./.github/actions/restore-candidate
        with:
          source-sha: ${{ github.sha }}
          build-sha256: ${{ needs.candidate.outputs.build_sha256 }}

      - name: Test packed consumer smoke fixtures
        if: github.event_name == 'pull_request'
        run: bash test/fixtures/smoke.sh --artifact-dir test/tmp/candidate

      - name: Test complete package fixture inventory
        if: github.event_name == 'push'
        run: npm run test:fixtures -- --artifact-dir test/tmp/candidate

  windows-package-smoke:
    name: Package smoke (Windows x64)
    needs: candidate
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release profile
        run: npm run check:release-profile -- --host windows-x64 --runner windows-2025

      - name: Install dependencies
        run: npm ci

      - name: Test archive portability under Git Bash
        shell: bash
        env:
          MNJS_REQUIRE_GNU_TAR: '1'
        run: node --test test/release/archive.test.mjs

      - name: Restore exact candidate
        uses: ./.github/actions/restore-candidate
        with:
          source-sha: ${{ github.sha }}
          build-sha256: ${{ needs.candidate.outputs.build_sha256 }}

      - name: Test package fixtures
        run: npm run test:fixtures -- --artifact-dir test/tmp/candidate

  size:
    name: Bundle size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release profile
        run: npm run check:release-profile -- --host linux-x64 --runner ubuntu-24.04

      - name: Install dependencies
        run: npm ci

      - name: Build exact pull request head
        run: npm run build && npm run test:dist

      - name: Checkout exact pull request base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: bundle-size-base
          persist-credentials: false

      - name: Build base branch
        working-directory: bundle-size-base
        run: |
          MNJS_SKIP_PREPARE= npm ci

      - name: Measure and compare bundle sizes
        id: measure
        run: |
          set -euo pipefail
          base_status=0
          node bundle-size-base/scripts/performance/bundle-size.mjs --root bundle-size-base --config bundle-size-base/config/performance.json --json --no-enforce > bundle-size-base.json || base_status=$?
          measurement_status=0
          node scripts/performance/bundle-size.mjs --json > bundle-size-current.json || measurement_status=$?
          report_status=0
          if [ "${base_status}" -ne 0 ]; then
            printf '%s\n' '<!-- bundle-size-report -->' '## Bundle size report' '' 'Base measurement failed. Comparison is unavailable; inspect the measurement logs in this CI run.' > bundle-size-report.md
          else
            node scripts/performance/bundle-size.mjs --report bundle-size-base.json bundle-size-current.json > bundle-size-report.md || report_status=$?
          fi
          cat bundle-size-report.md >> "${GITHUB_STEP_SUMMARY}"
          node scripts/performance/data-package-size.mjs
          node scripts/performance/adapters-package-size.mjs
          if [ "${base_status}" -ne 0 ] || [ "${measurement_status}" -ne 0 ] || [ "${report_status}" -ne 0 ]; then
            exit 1
          fi

      - name: Upload bundle-size report
        if: always() && steps.measure.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-size-report
          path: |
            bundle-size-report.md
            bundle-size-base.json
            bundle-size-current.json
          if-no-files-found: error
          retention-days: 7

  performance-timing:
    name: Performance timing (reporting only)
    if: github.event_name == 'pull_request'
    needs: candidate
    runs-on: ubuntu-24.04
    container:
      # Keep the image version/digest aligned with the Playwright lockfiles.
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --user 1001:1001 --shm-size=1g
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release profile
        run: npm run check:release-profile -- --host linux-x64 --runner ubuntu-24.04

      - name: Install dependencies
        run: npm ci

      - name: Restore exact candidate
        uses: ./.github/actions/restore-candidate
        with:
          source-sha: ${{ github.sha }}
          build-sha256: ${{ needs.candidate.outputs.build_sha256 }}

      - name: Checkout exact pull request base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: test/tmp/performance-base
          persist-credentials: false

      - name: Build pull request base
        working-directory: test/tmp/performance-base
        run: |
          MNJS_SKIP_PREPARE= npm ci

      - name: Verify provisioned browsers
        timeout-minutes: 2
        run: node scripts/checks/provisioned-browsers.mjs

      # The exact base may pin a different browser revision. Keep its download
      # separate so Playwright cannot garbage-collect the candidate image cache.
      - name: Install exact base Chromium
        timeout-minutes: 10
        working-directory: test/tmp/performance-base
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-base
        run: npx --no-install playwright install chromium

      - name: Measure browser timing on exact base and candidate
        run: |
          set -euo pipefail
          (cd test/tmp/performance-base && PLAYWRIGHT_BROWSERS_PATH="${RUNNER_TEMP}/playwright-base" node scripts/performance/browser.mjs --profile baseline --output test/tmp/browser-timing.json)
          node scripts/performance/browser.mjs --profile baseline --output test/tmp/browser-timing.json

      - name: Measure hosted timing
        run: |
          set -euo pipefail
          current_timing_script='scripts/performance/timing.mjs'
          base_timing_script='test/tmp/performance-base/scripts/performance/timing.mjs'
          test -f "${base_timing_script}"
          node "${base_timing_script}" --root test/tmp/performance-base --config test/tmp/performance-base/config/performance.json --json > performance-timing-base.json
          node "${current_timing_script}" --config config/performance.json --json > performance-timing-current.json
          node "${current_timing_script}" --report performance-timing-base.json performance-timing-current.json > performance-timing-report.md
          node scripts/performance/browser-report.mjs test/tmp/performance-base/test/tmp/browser-timing.json test/tmp/browser-timing.json >> performance-timing-report.md
          cat performance-timing-report.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload hosted timing report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-timing-report
          path: performance-timing-report.md
          if-no-files-found: error
          retention-days: 1

      - name: Upload raw timing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-timing-evidence
          path: |
            performance-timing-base.json
            performance-timing-current.json
            test/tmp/browser-timing.json
            test/tmp/performance-base/test/tmp/browser-timing.json
          if-no-files-found: warn
          retention-days: 30
