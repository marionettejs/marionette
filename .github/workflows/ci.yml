name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node 24
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release profile
        run: npm run check:release-profile -- --host linux-x64 --runner ubuntu-24.04

      - name: Verify release promotion policy
        run: npm run check:release-promotion

      - name: Install dependencies
        run: npm ci

      - name: Verify browser profile
        run: npm run check:browser-profile

      - name: Verify diagnostic catalog
        run: npm run check:diagnostics

      - name: Test performance contract
        run: npm run test:performance

      - name: Test source ESM
        run: npm run test:source

      - name: Lint
        run: npm run lint:ci

      - name: Verify distributable artifacts
        run: npm run check:dist

      - name: Coverage
        run: npm run coverage

      - name: Test package fixtures
        run: npm run test:fixtures

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-node-24
          path: coverage/
          if-no-files-found: warn

  package-smoke:
    name: Package smoke (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            host: macos-arm64
            runner: macos-15
          - name: Windows x64
            host: windows-x64
            runner: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release profile
        run: npm run check:release-profile -- --host ${{ matrix.host }} --runner ${{ matrix.runner }}

      - name: Install dependencies
        run: npm ci

      - name: Test package fixtures
        run: npm run test:fixtures

  size:
    name: Bundle size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release profile
        run: npm run check:release-profile -- --host linux-x64 --runner ubuntu-24.04

      - name: Install dependencies
        run: npm ci

      - name: Build current branch
        run: npm run build

      - name: Check current performance contract
        id: current_contract
        continue-on-error: true
        run: node config/bundle-size.mjs --json > bundle-size-current.json

      - name: Checkout exact pull request base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: bundle-size-base
          persist-credentials: false

      - name: Build base branch
        working-directory: bundle-size-base
        run: |
          npm ci
          npm run build

      - name: Enforce exact base performance contract
        id: base_authority
        continue-on-error: true
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base_contract='bundle-size-base/config/performance.json'
          authority_script='bundle-size-base/config/bundle-size.mjs'
          # Each exact-SHA fallback becomes permanently unreachable after its reviewed bootstrap merges.
          if [ ! -f "${base_contract}" ]; then
            if [ "${PULL_REQUEST_BASE_SHA}" != '31151c9cb5cb1e11d30da4332f58ca8b56cf2fe4' ]; then
              echo 'Base has no performance contract and is not the reviewed performance bootstrap base.' >&2
              exit 1
            fi
            base_contract='config/performance.json'
            authority_script='config/bundle-size.mjs'
            echo 'Using the current contract for the performance bootstrap from exact base 31151c9.'
          elif [ ! -f 'bundle-size-base/config/performance-resources.mjs' ]; then
            if [ "${PULL_REQUEST_BASE_SHA}" != '25f3739376d391df396885f3ea1b88fa1ea7a0f0' ]; then
              echo 'Base has no resource comparator and is not the reviewed bootstrap base.' >&2
              exit 1
            fi
            authority_script='config/bundle-size.mjs'
            echo 'Using the current validator for the resource bootstrap from exact base 25f3739.'
          fi
          node "${authority_script}" --root bundle-size-base --config "${base_contract}" --json --no-enforce > bundle-size-base.json
          authority_status=0
          node "${authority_script}" --config "${base_contract}" --json > bundle-size-authority.json || authority_status=$?
          candidate_status=0
          node "${authority_script}" --validate-resource-contract "${base_contract}" config/performance.json || candidate_status=$?
          report_status=0
          node "${authority_script}" --report bundle-size-base.json bundle-size-authority.json > bundle-size-report.md || report_status=$?
          cat bundle-size-report.md >> "${GITHUB_STEP_SUMMARY}"
          if [ "${authority_status}" -ne 0 ] || [ "${candidate_status}" -ne 0 ] || [ "${report_status}" -ne 0 ]; then
            exit 1
          fi

      - name: Upload bundle-size report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-size-report
          path: bundle-size-report.md
          if-no-files-found: error
          retention-days: 1

      - name: Enforce bundle-size budgets
        if: steps.current_contract.outcome == 'failure' || steps.base_authority.outcome == 'failure'
        run: exit 1

  performance-timing:
    name: Performance timing (reporting only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release profile
        run: npm run check:release-profile -- --host linux-x64 --runner ubuntu-24.04

      - name: Install dependencies
        run: npm ci

      - name: Build current branch
        run: npm run build

      - name: Checkout exact pull request base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: performance-base
          persist-credentials: false

      - name: Build pull request base
        working-directory: performance-base
        run: |
          npm ci
          npm run build

      - name: Measure hosted timing
        run: |
          node benchmarks/performance.mjs --root performance-base --config config/performance.json --json > performance-timing-base.json
          node benchmarks/performance.mjs --config config/performance.json --json > performance-timing-current.json
          node benchmarks/performance.mjs --report performance-timing-base.json performance-timing-current.json > performance-timing-report.md
          cat performance-timing-report.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload hosted timing report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-timing-report
          path: performance-timing-report.md
          if-no-files-found: error
          retention-days: 1
