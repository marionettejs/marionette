name: Release promotion

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.nvmrc'
      - '**/.npmrc'
      - '**/.npmignore'
      - '**/.gitignore'
      - '.babelrc'
      - 'scripts/release/**'
      - 'scripts/docs/**'
      - 'scripts/checks/**'
      - 'scripts/performance/**'
      - 'scripts/diagnostics/**'
      - 'scripts/api-contracts/**'
      - 'config/**'
      - '**/tsconfig*.json'
      - '**/package-lock.json'
      - '**/package.json'
      - '**/rollup.config.mjs'
      - 'build/**'
      - 'tools/**'
      - 'test/release/**'
      - 'test/dist/**'
      - 'test/types/**'
      - 'test/fixtures/run.mjs'
      - 'test/fixtures/smoke.sh'
      - 'vitest.config.js'
      - 'playwright.config.mjs'
      - 'playwright.core-release.config.mjs'
      - 'eslint.config.mjs'
  workflow_dispatch:
    inputs:
      publish:
        description: Request publication; requires checked-in authorization for this version
        required: true
        type: boolean
        default: false
      certification_run_id:
        description: Successful dry-run workflow run ID required for publication
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-promotion-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MNJS_SKIP_PREPARE: '1'
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PROMOTION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'publish' || 'dry-run' }}

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    outputs:
      certification_run_id: ${{ steps.preflight.outputs.certification_run_id }}
      mode: ${{ steps.preflight.outputs.mode }}

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify release profile
        run: npm run check:release-profile -- --host linux-x64 --runner ubuntu-24.04

      - name: Authorize workflow mode
        id: preflight
        env:
          CERTIFICATION_RUN_ID: ${{ inputs.certification_run_id }}
        run: |
          args=(
            --mode "${PROMOTION_MODE}"
            --repository "${GITHUB_REPOSITORY}"
            --repository-id "${GITHUB_REPOSITORY_ID}"
            --ref "${GITHUB_REF}"
            --event "${GITHUB_EVENT_NAME}"
          )
          if [ -n "${CERTIFICATION_RUN_ID}" ]; then
            args+=(--certification-run-id "${CERTIFICATION_RUN_ID}")
          fi
          npm run check:release-promotion -- "${args[@]}"

  build:
    name: Build verified tarballs
    if: needs.preflight.outputs.mode == 'dry-run'
    needs: preflight
    runs-on: ubuntu-24.04
    outputs:
      build_sha256: ${{ steps.outputs.outputs.sha256 }}
      npm_tag: ${{ steps.artifact.outputs.npm_tag }}
      prerelease: ${{ steps.artifact.outputs.prerelease }}
      tag: ${{ steps.artifact.outputs.tag }}
      utils_tarball: ${{ steps.artifact.outputs.utils_tarball }}
      radio_tarball: ${{ steps.artifact.outputs.radio_tarball }}
      core_tarball: ${{ steps.artifact.outputs.core_tarball }}
      data_tarball: ${{ steps.artifact.outputs.data_tarball }}
      adapters_tarball: ${{ steps.artifact.outputs.adapters_tarball }}
      version: ${{ steps.artifact.outputs.version }}

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify release profile
        run: npm run check:release-profile -- --host linux-x64 --runner ubuntu-24.04

      - name: Install pinned dependencies
        run: npm ci

      - name: Pack immutable release artifacts
        id: artifact
        run: >-
          npm run release:artifact --
          --output release
          --source-commit "${{ env.SOURCE_SHA }}"
          --source-ref "${{ github.ref }}"
          --repository "${{ github.repository }}"

      - name: Prepare independent HTML renderer for documentation
        run: npm run docs:prepare-html

      - name: Upload independent renderer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-html-${{ env.SOURCE_SHA }}
          path: packages/html/artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Capture compiled outputs
        id: outputs
        run: npm run release:outputs -- --mode capture

      - name: Upload compiled outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-outputs-${{ env.SOURCE_SHA }}
          path: test/tmp/build-outputs/
          if-no-files-found: error
          retention-days: 7

      - name: Upload immutable release artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ env.SOURCE_SHA }}
          path: release/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Record workflow artifact digest
        run: >-
          echo "Workflow artifact SHA-256: ${{ steps.upload.outputs.artifact-digest }}"
          >> "${GITHUB_STEP_SUMMARY}"

  candidate-checks:
    name: Candidate ${{ matrix.group }}
    if: needs.preflight.outputs.mode == 'dry-run'
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    container:
      # Keep the image version/digest aligned with the Playwright lockfiles.
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --user 1001:1001 --shm-size=1g
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    strategy:
      fail-fast: false
      matrix:
        group: [source, tooling, documentation, distribution, browser, fixtures]
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release profile
        run: npm run check:release-profile -- --host linux-x64 --runner ubuntu-24.04

      - name: Install dependencies
        run: npm ci

      - name: Download immutable candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ env.SOURCE_SHA }}
          path: release

      - name: Verify immutable candidate
        run: npm run release:verify -- --artifact-dir release --source-commit "${{ env.SOURCE_SHA }}"

      - name: Download compiled outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-outputs-${{ env.SOURCE_SHA }}
          path: test/tmp/build-outputs

      - name: Restore compiled outputs
        env:
          BUILD_OUTPUT_SHA256: ${{ needs.build.outputs.build_sha256 }}
        run: npm run release:outputs -- --mode restore --sha256 "$BUILD_OUTPUT_SHA256"

      - name: Verify provisioned browsers
        if: matrix.group == 'browser'
        timeout-minutes: 2
        run: node scripts/checks/provisioned-browsers.mjs

      - name: Validate independent candidate checks
        run: npm run release:validate -- --artifact-dir release --group "${{ matrix.group }}"

      - name: Upload lane evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-checks-${{ matrix.group }}-${{ env.SOURCE_SHA }}
          path: |
            release/candidate-validation-*.json
            release/candidate-validation-*.sha512
            release/validation-*.log
            release/browser-*.json
            release/fixtures-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload lane diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-diagnostics-${{ matrix.group }}-${{ env.SOURCE_SHA }}
          path: |
            test/tmp/browser/report/
            test/tmp/browser/results/
            test/tmp/browser/results.xml
            coverage/
            !coverage/tooling/tmp/
          if-no-files-found: warn
          retention-days: 30

  certification:
    name: Certify exact candidate
    if: always() && needs.preflight.outputs.mode == 'dry-run'
    needs: [preflight, build, candidate-checks, package-smoke, consumer-lts]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation lane
        env:
          SUITE_RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$SUITE_RESULTS"

      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Download immutable candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ env.SOURCE_SHA }}
          path: release

      - name: Download independent validation evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-checks-*-${{ env.SOURCE_SHA }}
          merge-multiple: true
          path: release

      - name: Join and verify complete candidate certificate
        run: npm run release:validate -- --artifact-dir release --join

      - name: Upload certified candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: certified-candidate-${{ env.SOURCE_SHA }}
          path: release/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  package-smoke:
    name: Release package smoke (${{ matrix.name }})
    if: needs.preflight.outputs.mode == 'dry-run'
    needs: [preflight, build]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
            && '[{"name":"macOS arm64","host":"macos-arm64","runner":"macos-15","shard_index":1,"shard_total":1}]'
            || '[{"name":"macOS arm64","host":"macos-arm64","runner":"macos-15","shard_index":1,"shard_total":1},{"name":"Windows x64 1/4","host":"windows-x64","runner":"windows-2025","shard_index":1,"shard_total":4},{"name":"Windows x64 2/4","host":"windows-x64","runner":"windows-2025","shard_index":2,"shard_total":4},{"name":"Windows x64 3/4","host":"windows-x64","runner":"windows-2025","shard_index":3,"shard_total":4},{"name":"Windows x64 4/4","host":"windows-x64","runner":"windows-2025","shard_index":4,"shard_total":4}]') }}

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release profile
        run: npm run check:release-profile -- --host ${{ matrix.host }} --runner ${{ matrix.runner }}

      - name: Download immutable release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ env.SOURCE_SHA }}
          path: release

      - name: Verify release evidence
        run: >-
          npm run release:verify --
          --artifact-dir release
          --source-commit "${{ env.SOURCE_SHA }}"
          --repository "${{ github.repository }}"

      - name: Download independent renderer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-html-${{ env.SOURCE_SHA }}
          path: packages/html/artifacts

      - name: Select transferred renderer
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { htmlCandidate } from './test/docs/html-candidate.mjs';
          appendFileSync(process.env.GITHUB_ENV, `MNJS_HTML_TARBALL=${htmlCandidate().path}\n`);
          JS

      - name: Test exact packed package fixtures
        run: >-
          npm run test:fixtures --
          --artifact-dir release
          --report test/tmp/release-fixtures-${{ matrix.shard_index }}-of-${{ matrix.shard_total }}.json
          --shard-index ${{ matrix.shard_index }}
          --shard-total ${{ matrix.shard_total }}

      - name: Upload package smoke diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-fixtures-${{ matrix.host }}-${{ matrix.shard_index }}-of-${{ matrix.shard_total }}-${{ env.SOURCE_SHA }}
          path: test/tmp/release-fixtures-${{ matrix.shard_index }}-of-${{ matrix.shard_total }}.json
          if-no-files-found: warn
          retention-days: 30

  consumer-lts:
    name: Release consumer Node ${{ matrix.node }}
    if: needs.preflight.outputs.mode == 'dry-run'
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['26.0.0', '26']
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Setup source toolchain for evidence verification
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download immutable release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ env.SOURCE_SHA }}
          path: release

      - name: Verify release evidence
        run: >-
          npm run release:verify --
          --artifact-dir release
          --source-commit "${{ env.SOURCE_SHA }}"
          --repository "${{ github.repository }}"

      - name: Download independent renderer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-html-${{ env.SOURCE_SHA }}
          path: packages/html/artifacts

      - name: Select transferred renderer
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { htmlCandidate } from './test/docs/html-candidate.mjs';
          appendFileSync(process.env.GITHUB_ENV, `MNJS_HTML_TARBALL=${htmlCandidate().path}\n`);
          JS

      - name: Setup consumer Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Test exact packed package fixtures
        run: npm run test:fixtures -- --artifact-dir release --report test/tmp/release-consumer-fixtures.json
        env:
          npm_config_engine_strict: 'true'

      - name: Verify installed documentation recipes
        run: npm run check:docs-installed -- --artifact-dir release
        env:
          npm_config_engine_strict: 'true'

      - name: Upload consumer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-consumer-node-${{ matrix.node }}-${{ env.SOURCE_SHA }}
          path: |
            test/tmp/release-consumer-fixtures.json
            test/tmp/docs-installed/report.json
          if-no-files-found: error
          retention-days: 30

  promotion-dry-run:
    name: Promotion dry run
    if: needs.preflight.outputs.mode == 'dry-run'
    needs: [preflight, build, certification]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Setup Node for npm registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/

      - name: Download immutable release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: certified-candidate-${{ env.SOURCE_SHA }}
          path: release

      - name: Verify release evidence
        run: >-
          npm run release:verify --
          --artifact-dir release
          --source-commit "${{ env.SOURCE_SHA }}"
          --repository "${{ github.repository }}"
          --require-validation

      - name: Inspect immutable publication targets
        id: dry_run_targets
        run: npm run release:targets -- --mode dry-run --artifact-dir release
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Exercise utils npm publication without publishing
        if: steps.dry_run_targets.outputs.utils_npm_state == 'available'
        run: >-
          npm publish
          "./release/${{ needs.build.outputs.utils_tarball }}"
          --dry-run
          --ignore-scripts
          --access public
          --tag "${{ needs.build.outputs.npm_tag }}"

      - name: Exercise radio npm publication without publishing
        if: steps.dry_run_targets.outputs.radio_npm_state == 'available'
        run: >-
          npm publish
          "./release/${{ needs.build.outputs.radio_tarball }}"
          --dry-run
          --ignore-scripts
          --access public
          --tag "${{ needs.build.outputs.npm_tag }}"

      - name: Exercise core npm publication without publishing
        if: steps.dry_run_targets.outputs.core_npm_state == 'available'
        run: >-
          npm publish
          "./release/${{ needs.build.outputs.core_tarball }}"
          --dry-run
          --ignore-scripts
          --access public
          --tag "${{ needs.build.outputs.npm_tag }}"

      - name: Exercise data npm publication without publishing
        if: steps.dry_run_targets.outputs.data_npm_state == 'available'
        run: >-
          npm publish
          "./release/${{ needs.build.outputs.data_tarball }}"
          --dry-run
          --ignore-scripts
          --access public
          --tag "${{ needs.build.outputs.npm_tag }}"

      - name: Exercise adapters npm publication without publishing
        if: steps.dry_run_targets.outputs.adapters_npm_state == 'available'
        run: >-
          npm publish
          "./release/${{ needs.build.outputs.adapters_tarball }}"
          --dry-run
          --ignore-scripts
          --access public
          --tag "${{ needs.build.outputs.npm_tag }}"

      - name: Exercise GitHub release plan without publishing
        run: npm run release:github -- --mode dry-run --artifact-dir release

  certified_artifact:
    name: Import certified release artifact
    if: needs.preflight.outputs.mode == 'publish'
    needs: preflight
    runs-on: ubuntu-24.04
    outputs:
      npm_tag: ${{ steps.verify.outputs.npm_tag }}
      prerelease: ${{ steps.verify.outputs.prerelease }}
      tag: ${{ steps.verify.outputs.tag }}
      utils_tarball: ${{ steps.verify.outputs.utils_tarball }}
      radio_tarball: ${{ steps.verify.outputs.radio_tarball }}
      core_tarball: ${{ steps.verify.outputs.core_tarball }}
      data_tarball: ${{ steps.verify.outputs.data_tarball }}
      adapters_tarball: ${{ steps.verify.outputs.adapters_tarball }}
      version: ${{ steps.verify.outputs.version }}

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Require successful dry-run certification
        env:
          CERTIFICATION_RUN_ID: ${{ needs.preflight.outputs.certification_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CERTIFICATION_RUN_ID}" > "${RUNNER_TEMP}/certification-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CERTIFICATION_RUN_ID}/jobs?per_page=100" > "${RUNNER_TEMP}/certification-jobs.json"
          jq -e --arg sha "${SOURCE_SHA}" '
            .conclusion == "success" and
            .event == "workflow_dispatch" and
            .head_sha == $sha and
            .path == ".github/workflows/release.yml"
          ' "${RUNNER_TEMP}/certification-run.json" > /dev/null
          jq -e '
            [.jobs[] | select(.name == "Promotion dry run" and .conclusion == "success")] | length == 1
          ' "${RUNNER_TEMP}/certification-jobs.json" > /dev/null

      - name: Download certified release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: certified-candidate-${{ env.SOURCE_SHA }}
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.certification_run_id }}

      - name: Verify certified release evidence
        id: verify
        run: >-
          npm run release:verify --
          --artifact-dir release
          --source-commit "${{ env.SOURCE_SHA }}"
          --repository "${{ github.repository }}"
          --workflow-run-id "${{ needs.preflight.outputs.certification_run_id }}"
          --require-validation

  publication-targets:
    name: Authorize empty publication targets
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'marionettejs/marionette' &&
      github.repository_id == '2965621' &&
      github.ref == 'refs/heads/master' &&
      inputs.publish == true &&
      needs.preflight.outputs.mode == 'publish'
    needs: [preflight, certified_artifact]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download certified release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: certified-candidate-${{ env.SOURCE_SHA }}
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.certification_run_id }}

      - name: Verify release evidence
        run: >-
          npm run release:verify --
          --artifact-dir release
          --source-commit "${{ env.SOURCE_SHA }}"
          --repository "${{ github.repository }}"
          --workflow-run-id "${{ needs.preflight.outputs.certification_run_id }}"
          --require-validation

      - name: Require compatible npm, tag, and release targets
        run: npm run release:targets -- --mode publish --artifact-dir release
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    name: Publish verified tarballs and matching release
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'marionettejs/marionette' &&
      github.repository_id == '2965621' &&
      github.ref == 'refs/heads/master' &&
      inputs.publish == true &&
      needs.preflight.outputs.mode == 'publish'
    needs: [preflight, certified_artifact, publication-targets]
    environment: stable-release
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      id-token: write

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Setup Node for trusted publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/

      - name: Download certified release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: certified-candidate-${{ env.SOURCE_SHA }}
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.certification_run_id }}

      - name: Verify release evidence
        run: >-
          npm run release:verify --
          --artifact-dir release
          --source-commit "${{ env.SOURCE_SHA }}"
          --repository "${{ github.repository }}"
          --workflow-run-id "${{ needs.preflight.outputs.certification_run_id }}"
          --require-validation

      - name: Stage matching GitHub draft release
        run: npm run release:github -- --mode stage --artifact-dir release
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Decide whether npm publication is already complete
        id: npm_state
        run: npm run release:targets -- --mode npm-decision --artifact-dir release
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish exact utils tarball with npm provenance
        if: steps.npm_state.outputs.utils_npm_action == 'publish'
        run: >-
          npm publish
          "./release/${{ needs.certified_artifact.outputs.utils_tarball }}"
          --ignore-scripts
          --access public
          --tag "${{ needs.certified_artifact.outputs.npm_tag }}"

      - name: Publish exact radio tarball with npm provenance
        if: steps.npm_state.outputs.radio_npm_action == 'publish'
        run: >-
          npm publish
          "./release/${{ needs.certified_artifact.outputs.radio_tarball }}"
          --ignore-scripts
          --access public
          --tag "${{ needs.certified_artifact.outputs.npm_tag }}"

      - name: Publish exact core tarball with npm provenance
        if: steps.npm_state.outputs.core_npm_action == 'publish'
        run: >-
          npm publish
          "./release/${{ needs.certified_artifact.outputs.core_tarball }}"
          --ignore-scripts
          --access public
          --tag "${{ needs.certified_artifact.outputs.npm_tag }}"

      - name: Publish exact data tarball with npm provenance
        if: steps.npm_state.outputs.data_npm_action == 'publish'
        run: >-
          npm publish
          "./release/${{ needs.certified_artifact.outputs.data_tarball }}"
          --ignore-scripts
          --access public
          --tag "${{ needs.certified_artifact.outputs.npm_tag }}"

      - name: Publish exact adapters tarball with npm provenance
        if: steps.npm_state.outputs.adapters_npm_action == 'publish'
        run: >-
          npm publish
          "./release/${{ needs.certified_artifact.outputs.adapters_tarball }}"
          --ignore-scripts
          --access public
          --tag "${{ needs.certified_artifact.outputs.npm_tag }}"

      - name: Verify published npm integrity, channel and provenance metadata
        run: npm run release:targets -- --mode verify-npm --artifact-dir release
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish the staged GitHub release and tag
        run: npm run release:github -- --mode publish --artifact-dir release
        env:
          GH_TOKEN: ${{ github.token }}
