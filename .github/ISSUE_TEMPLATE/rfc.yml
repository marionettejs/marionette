name: RFC / design proposal
description: Propose a public API, architecture, or agent-development change.
title: "[RFC]: "
body:
  - type: markdown
    attributes:
      value: |
        Stable v5 is the agent-ready release. Proposals must demonstrate a public, reproducible benefit and preserve Marionette's clean, fast default production runtime.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the proposal and its canonical behavior.
    validations:
      required: true

  - type: textarea
    id: agent-failure
    attributes:
      label: Agent-development failure addressed
      description: Which observed mistake, ambiguity, or verification gap does this solve?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Public evidence
      description: Link or describe the public fixture, benchmark task, or contract that demonstrates the problem.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Proposed surface
      options:
        - Static tooling or documentation
        - Development-only surface
        - Test-only surface
        - Core runtime contract
        - Opt-in runtime integration
        - Evidence-dependent candidate
    validations:
      required: true

  - type: textarea
    id: public-api-impact
    attributes:
      label: Public API and behavior impact
      description: Describe additions, changes, removals, lifecycle ordering, diagnostics, and schema implications.
    validations:
      required: true

  - type: textarea
    id: runtime-cost
    attributes:
      label: Runtime cost
      description: Describe bundle, startup, hot-path, allocation, and retention impact, including how unused applications avoid the cost.
    validations:
      required: true

  - type: textarea
    id: canonical-pattern
    attributes:
      label: Canonical pattern and obsolete path
      description: What becomes the one preferred pattern, and what existing path is removed or deprecated?
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Acceptance and validation
      description: Define falsifiable correctness, agent benchmark, and performance results.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include exposing an existing fact, static-only, and no-change alternatives.
    validations:
      required: true

  - type: textarea
    id: rollback
    attributes:
      label: Rollback or deprecation plan
      description: State what happens if evidence is negative and how an exposed contract could be removed.
    validations:
      required: true

  - type: checkboxes
    id: public-scope
    attributes:
      label: Public scope
      options:
        - label: The proposal can be evaluated entirely from public artifacts.
          required: true
        - label: The proposal does not require a private consumer or private fixture.
          required: true
