name: v5 implementation task
description: Maintainer task for the agent-ready Marionette v5 release.
title: "[v5]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this template for focused stable-v5 work. The task must be implementable and reviewable using public evidence, with an explicit production-cost boundary.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: State the completed outcome in one or two sentences.
    validations:
      required: true

  - type: textarea
    id: agent-failure
    attributes:
      label: Agent-development failure addressed
      description: Name the observed ambiguity, mistake, or verification gap.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      placeholder: |
        Allowed:
        - ...

        Not allowed:
        - ...
    validations:
      required: true

  - type: textarea
    id: public-contract
    attributes:
      label: Public behavior contract
      description: State the canonical behavior, allowed changes, edge cases, and any compatibility exception with its removal condition.
    validations:
      required: true

  - type: dropdown
    id: runtime-cost-category
    attributes:
      label: Runtime cost category
      options:
        - Static or documentation only
        - Development or test only
        - Existing production path
        - Opt-in runtime path
    validations:
      required: true

  - type: textarea
    id: runtime-cost
    attributes:
      label: Runtime cost boundary
      description: State expected bundle, hot-path, allocation, and retention impact and the evidence required.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Tests and evidence
      description: List exact commands, fixtures, benchmark tasks, browsers, and performance checks required.
    validations:
      required: true

  - type: textarea
    id: rule-docs
    attributes:
      label: Rule catalog and documentation impact
      description: List diagnostic codes, lint metadata, declarations, examples, and docs that must agree.
    validations:
      required: true

  - type: textarea
    id: rollback
    attributes:
      label: Rollback or deprecation condition
      description: Explain how the work is removed, revised, or deprecated if its evidence fails.
    validations:
      required: true

  - type: textarea
    id: likely-files
    attributes:
      label: Likely files
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: Public references
      description: Link related strategy sections, issues, PRs, fixtures, or benchmark evidence.
    validations:
      required: false
